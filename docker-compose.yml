# xPay — full system (backend + frontend) via `docker compose up`
services:
  backend:
    container_name: xpay-backend
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - XPAY_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # Optional bounded-LLM assist (off unless a key is provided):
      # - XPAY_LLM_API_KEY=${XPAY_LLM_API_KEY}
      # - XPAY_LLM_MODEL=gpt-4o-mini

  frontend:
    container_name: xpay-frontend
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npm run build && npm run start"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
